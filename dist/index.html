<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
        color: #e6e8eb;
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      .box { text-align: center; }
      .spin {
        width: 28px;
        height: 28px;
        margin: 0 auto 16px;
        border: 3px solid #2a2f3a;
        border-top-color: #4f8cff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .msg { font-size: 14px; color: #9aa3af; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin"></div>
      <div class="msg">Starting DSH…</div>
    </div>
  </body>
</html>
