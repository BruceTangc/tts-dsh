[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DSH Desktop — Windows desktop shell reusing the existing DSH backend and Web UI"
authors = ["DSH"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
